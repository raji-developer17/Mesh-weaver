<!DOCTYPE html>
<html>
<head>
<title>MeshWeaver Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#0a0e14;color:#c5d1de;font-family:monospace;margin:0}
.header{padding:15px;background:#111827;display:flex;justify-content:space-between;border-bottom:1px solid #1f2937}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:15px}
.card{background:#111827;border:1px solid #1f2937;padding:15px;border-radius:8px;text-align:center}
.card h3{margin:0;font-size:12px;color:#9ca3af} .card p{font-size:24px;margin:5px 0;color:#22d3ee}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:15px;align-items:stretch}
.panel{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:15px;display:flex;flex-direction:column;justify-content:center}
#topo{width:100% !important; max-width:380px; height:320px !important; margin:auto; display:block}
.log{height:300px;overflow-y:auto;background:#000;padding:10px;font-size:12px;border-radius:6px}
.node-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.online{background:#22c55e;box-shadow:0 0 8px #22c55e}
.offline{background:#ef4444}
</style>
</head>
<body>
<div class="header"><div>MeshWeaver Dashboard <small>Decentralized P2P Task Mesh</small></div><div id="time"></div></div>
<div class="cards">
<div class="card"><h3>Total Nodes</h3><p id="total">5</p></div>
<div class="card"><h3>Online</h3><p id="online" style="color:#22c55e">5</p></div>
<div class="card"><h3>Offline</h3><p id="offline" style="color:#ef4444">0</p></div>
<div class="card"><h3>Running Tasks</h3><p id="running">0</p></div>
<div class="card"><h3>Completed</h3><p id="completed">0</p></div>
<div class="card"><h3>Failed</h3><p id="failed">0</p></div>
</div>
<div class="grid">
<div class="panel"><h4>Mesh Topology</h4><canvas id="topo" width="400" height="200"></canvas><div id="nodes-list"></div></div>
<div class="panel"><h4>Node Status</h4><table id="nodeTable" width="100%" style="font-size:13px"></table><br>
<textarea id="taskInput" style="width:100%;height:80px;background:#000;color:#0f0">def factorial(n):
    import math
    return math.factorial(n)
result = factorial(20)</textarea><br><br>
<button onclick="submitTask()" style="width:100%;padding:10px;background:#22d3ee;border:none;border-radius:6px">Submit Task to Best Node</button>
</div>
</div>
<div class="grid">
<div class="panel"><h4>Live Task Execution Log</h4><div id="log" class="log"></div></div>
<div class="panel"><h4>CPU Usage</h4><canvas id="cpuChart"></canvas></div>
</div>
<script>
var cpuChart;
function initChart(){
 var ctx=document.getElementById('cpuChart').getContext('2d');
 cpuChart=new Chart(ctx,{type:'line',data:{labels:Array(20).fill(''),datasets:[]},options:{responsive:true,plugins:{legend:{labels:{color:'#fff'}}},scales:{y:{beginAtZero:true,max:100}}}});
}
initChart();
function drawTopology(nodes) {
  var canvas = document.getElementById('topo');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  var centerX = canvas.width / 2;
  var centerY = canvas.height / 2;
  var radius = 75;
  var positions = {};
  nodes.forEach((node, i) => {
    var angle = (i / nodes.length) * 2 * Math.PI;
    var x = centerX + radius * Math.cos(angle);
    var y = centerY + radius * Math.sin(angle);
    positions[node.id] = {x, y};
  });
ctx.strokeStyle = '#334155'; 
ctx.lineWidth = 2;
ctx.shadowColor = '#22d3ee';
ctx.shadowBlur = 5;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      if (nodes[i].status == 'online' && nodes[j].status == 'online') {
        ctx.beginPath();
        ctx.moveTo(positions[nodes[i].id].x, positions[nodes[i].id].y);
        ctx.lineTo(positions[nodes[j].id].x, positions[nodes[j].id].y);
        ctx.stroke();
      }
    }
  }
ctx.shadowBlur = 0;
  
  nodes.forEach(node => {
    var pos = positions[node.id];
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 12, 0, 2 * Math.PI);
    ctx.fillStyle = node.status == 'online'? '#22c55e' : '#ef4444';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    
    ctx.fillStyle = '#c5d1de';
    ctx.font = '12px monospace';
    ctx.fillText(node.id, pos.x - 18, pos.y + 28);
    ctx.fillText(node.cpu + '%', pos.x - 12, pos.y - 18);
  });
}

let lastLogCount = 0;
function loadData(){
 fetch('/api/nodes').then(r=>r.json()).then(nodes=>{
   document.getElementById('online').innerText=nodes.filter(n=>n.status=='online').length;
   document.getElementById('offline').innerText=nodes.filter(n=>n.status=='offline').length;
   document.getElementById('total').innerText=nodes.length;
   let html='<tr><th>ID</th><th>IP</th><th>Port</th><th>Status</th><th>CPU</th><th>RAM</th><th>Action</th></tr>';
   nodes.forEach(n=>{
    html+=`<tr><td>${n.id}</td><td>${n.ip}</td><td>${n.port}</td><td><span class="node-dot ${n.status}"></span> ${n.status}</td><td>${n.cpu}%</td><td>${n.ram}%</td><td><button onclick="toggleNode('${n.id}')">Toggle</button></td></tr>`;
   });
   document.getElementById('nodeTable').innerHTML=html;
   
   drawTopology(nodes);
 });
 
 
 fetch('/api/logs').then(r=>r.json()).then(data=>{
   document.getElementById('running').innerText=data.stats.running;
   document.getElementById('completed').innerText=data.stats.completed;
   document.getElementById('failed').innerText=data.stats.failed;
   
   let div=document.getElementById('log');
   div.innerHTML = data.logs.slice().reverse().map(entry=>{
     let color = entry.type=='success'?'#22c55e':entry.type=='error'?'#ef4444':'#22d3ee';
     return `<div style="color:${color}">[${entry.time}] ${entry.msg}</div>`;
   }).join('');
   if(cpuChart && data.cpu_history){
     cpuChart.data.datasets = Object.keys(data.cpu_history).map((k,i)=>({label:k,data:data.cpu_history[k],borderColor:`hsl(${i*60},70%,50%)`,tension:0.4}));
     cpuChart.update();
   }
 });
}

setInterval(loadData, 2000);
loadData();

function submitTask(){
 let code = document.getElementById('taskInput').value;
 console.log("Submitting:", code);
 fetch('/api/submit_task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})})
 .then(r=>r.json()).then(d=>{
   console.log("Response:", d);
   alert("Task Assigned to: " + d.assigned_to);
   setTimeout(loadData, 1000);
 }).catch(e=>{console.error(e); alert("Error: "+e)});
}
function toggleNode(id){fetch('/api/toggle_node/'+id,{method:'POST'}).then(()=>loadData());}
setInterval(()=>{document.getElementById('time').innerText=new Date().toLocaleTimeString()},1000);
</script>
</body>
</html>
